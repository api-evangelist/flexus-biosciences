name: Flexus Biosciences
description: 'Flexus Biosciences was a South San Francisco / San Carlos, California
  biotechnology company founded in 2013 to develop small-molecule cancer immunotherapies,
  most notably inhibitors of the IDO/TDO immunosuppressive pathway (lead IDO1 program
  F001287). Backed by Kleiner Perkins and The Column Group, it was acquired by Bristol-Myers
  Squibb in February 2015 for up to roughly $1.25 billion (about $800M upfront) to
  expand BMS''s immuno-oncology pipeline. The company no longer operates independently;
  its domain redirects to the Bristol-Myers Squibb acquisition announcement. It publishes
  no public developer portal, documentation, or API, so this profile carries company
  identity only and no technical API artifacts.'
